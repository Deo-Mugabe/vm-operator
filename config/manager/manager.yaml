apiVersion: v1
kind: Namespace
metadata:
  name: vmfleet-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmfleet-operator
  namespace: vmfleet-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vmfleet-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vmfleet-operator-role
subjects:
- kind: ServiceAccount
  name: vmfleet-operator
  namespace: vmfleet-system
---
apiVersion: v1
kind: Secret
metadata:
  name: vcenter-credentials
  namespace: vmfleet-system
type: Opaque
stringData:
  # vCenter connection details — change these for real vCenter
  VC_HOST: https://172.31.179.76:8989/sdk
  VC_USER: user
  VC_PASS: pass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmfleet-operator
  namespace: vmfleet-system
  labels:
    app: vmfleet-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmfleet-operator
  template:
    metadata:
      labels:
        app: vmfleet-operator
    spec:
      serviceAccountName: vmfleet-operator
      containers:
      - name: manager
        image: k3d-myregistry.localhost:5050/vmfleet-operator:latest
        imagePullPolicy: Always
        args:
        - --insecure
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        env:
        - name: VC_HOST
          valueFrom:
            secretKeyRef:
              name: vcenter-credentials
              key: VC_HOST
        - name: VC_USER
          valueFrom:
            secretKeyRef:
              name: vcenter-credentials
              key: VC_USER
        - name: VC_PASS
          valueFrom:
            secretKeyRef:
              name: vcenter-credentials
              key: VC_PASS
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 8081
          name: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi
